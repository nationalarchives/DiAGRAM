server {
    listen 80;
    root /usr/share/nginx/html;

    # Never cache HTML — ensures browsers always get the latest content-hashed
    # JS/CSS references after a rebuild.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    # Proxy all /api/ requests to the Python API service
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Serve static frontend files (JS/CSS are content-hashed so long-lived cache is fine)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
