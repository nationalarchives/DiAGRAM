name: DiAGRAM e2e Tests
on:
  push:
    branches:
      -  DR2-2220-Write-DiAGRAM-tests

  workflow_dispatch:

jobs:
  cypress-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm --prefix test install

      - run: npm --prefix test run cypress:ci
