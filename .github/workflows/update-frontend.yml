name: Update frontend

on:
  push:
    branches:
      - live
    paths:
      - app/**
      - .github/workflows/update-frontend.yml
jobs:
  update_site_env_matching_branch:
    permissions:
      actions: write
    environment: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[ci skip]')"
    steps:
      - name: Provision runner
        uses: nationalarchives/org-actions-provision-runner@8a7931f25ad0176bd4e4872ee83d21af94a48125 # v1.0.2
        with:
          wiz-sensor-token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: run-release-process
        run:
          gh workflow run release.yml
        env:
          GH_TOKEN: ${{ github.token }}
