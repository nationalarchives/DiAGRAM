name: Combine PRs

on:
  workflow_dispatch:
  schedule:
    - cron: 0 9 * * MON-FRI

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  combine-prs:
    runs-on: ubuntu-latest

    steps:
      - name: combine-prs
        id: combine-prs
        uses: github/combine-prs@v5.2.0
        with:
          branch_regex: '.*'