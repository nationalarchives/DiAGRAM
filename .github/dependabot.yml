version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/tests"
      - "/app"
    schedule:
      interval: "daily"
    groups:
      js-dependencies:
        patterns:
          - "*"
    versioning-strategy: increase
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
